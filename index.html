#shell.onhome #bg{opacity:1}
#scroller{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:calc(100% - 0px)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top img{height:40px;width:auto;display:block}
.back{font:inherit;font-size:16px;color:var(--blue);background:none;border:0;padding:10px 4px;min-height:44px;cursor:pointer}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--red)}
h1,h2{font-family:var(--head);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(40px,11vw,54px)}
h2{font-size:clamp(32px,8.5vw,38px)}
.sub{color:var(--muted);margin:0}
.eyebrow{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:14px;min-height:110px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;min-width:0}
.tile:active{transform:scale(.97);border-color:var(--blue)}
.tile:focus-visible,.btn:focus-visible,.tab:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tile b{font-size:22px;font-weight:400}
.tile span.d{display:block;font-size:16px;color:var(--muted)}
.sw{width:30px;height:30px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.15)}
.tile{position:relative}
.tile[aria-pressed="true"]{border-color:var(--blue);background:var(--chip)}
.tile .ck{position:absolute;top:10px;right:12px;font-size:20px;color:var(--blue);display:none;font-weight:700}
.tile[aria-pressed="true"] .ck{display:block}
.tile.sug:not([aria-pressed="true"]){border-style:dashed;border-color:var(--blue)}
.tile .pw{position:absolute;top:14px;right:12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;display:none}
.tile.sug:not([aria-pressed="true"]) .pw{display:block}
.tile .why{display:block;font-size:15px;line-height:1.3;color:var(--blue);margin-top:4px}
.mix{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mix h3{margin:0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:400}
.mix p{margin:0;font-size:16px;line-height:1.35}
.btn[disabled]{opacity:1;background:var(--line);color:var(--muted);cursor:default}
#dock{flex:none;position:relative;z-index:6;padding:10px max(16px,env(safe-area-inset-left,0px)) 12px;background:linear-gradient(to top,var(--bg) 70%,rgba(255,255,255,0))}
#dock:empty{display:none}
#dock .next{display:block;width:100%;max-width:560px;margin:0 auto}
.count{font-size:16px;color:var(--muted);margin:0}
.btn{font:inherit;font-weight:400;font-size:21px;letter-spacing:.02em;border-radius:14px;border:0;min-height:56px;padding:14px 20px;cursor:pointer;background:var(--on);color:var(--on-fg);width:100%}
.btn.alt{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.home{flex:1;justify-content:center;gap:22px;text-align:center;align-items:center}
.home img{width:190px;max-width:60%;height:auto}
.home .stack{width:100%}
video{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.tabs{display:flex;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:4px}
.tab{flex:1;font:inherit;font-size:18px;font-weight:400;color:var(--muted);background:none;border:0;border-radius:10px;min-height:44px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--on);color:var(--on-fg)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
.panel p{margin:0}
ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.big{font-size:26px}
.drink{display:flex;flex-direction:column;gap:2px;padding-top:14px;border-top:1px solid var(--line)}
.drink:first-of-type{border-top:0;padding-top:0}
.drink b{font-family:var(--head);font-size:24px;font-weight:400}
.tag{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-left:8px;font-family:var(--body)}
.muted{color:var(--muted)}
.note{font-size:15px;color:var(--muted);text-align:center}
.pill{display:flex;gap:8px;flex-wrap:wrap}
.pill span{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}

.tight{font-size:clamp(28px,7.5vw,34px)}
.count{text-align:center}
.jarwrap{width:min(52vw,210px,21vh);min-width:128px;aspect-ratio:300/430;margin:0 auto;color:var(--fg);border-radius:20px;transition:box-shadow .15s}
@media (max-height:780px){.jarwrap:not(.reveal){width:min(40vw,150px,19vh);min-width:96px}.jnote{min-height:1.3em}}
.jarwrap.hot{box-shadow:0 0 0 5px var(--blue)}
.jarsvg{width:100%;height:auto;display:block;overflow:visible}
.lay.new{animation:rise .5s ease-out;transform-box:fill-box;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0);opacity:.2}to{transform:scaleY(1);opacity:1}}
.chunk.new{animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-110px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.chip{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:12px;min-height:64px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip .nm{font-size:16px;line-height:1.1;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--chip)}
.chip.sug:not([aria-pressed="true"]){border-style:dashed;border-color:var(--blue)}
.chip .ck{position:absolute;top:3px;right:8px;color:var(--blue);font-weight:700;font-size:16px}
.ghost{position:fixed;z-index:50;transform:translate(-50%,-70%);pointer-events:none;background:var(--panel);border:2px solid var(--blue);border-radius:999px;padding:8px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:17px;color:var(--fg)}
.ghost .sw{width:22px;height:22px}
.jnote{min-height:2.5em;margin:0;text-align:center;font-size:16px;color:var(--blue);line-height:1.3}
.center{text-align:center;justify-content:center;align-items:center}
.jarbtn{background:none;border:0;padding:0;margin:0 auto;width:min(70vw,300px);cursor:pointer;color:var(--fg);display:block}
.shaking{animation:shk 1.1s}
.shaking.big{animation:shk 1.7s}
@keyframes shk{0%,100%{transform:none}6%{transform:translate(-26px,-12px) rotate(-17deg)}13%{transform:translate(24px,10px) rotate(17deg)}20%{transform:translate(-24px,-10px) rotate(-15deg)}27%{transform:translate(24px,8px) rotate(15deg)}34%{transform:translate(-20px,-8px) rotate(-13deg)}41%{transform:translate(20px,7px) rotate(13deg)}49%{transform:translate(-16px,-6px) rotate(-10deg)}57%{transform:translate(16px,5px) rotate(10deg)}66%{transform:translate(-11px,-3px) rotate(-6deg)}76%{transform:translate(8px,2px) rotate(4deg)}88%{transform:translate(-3px,0) rotate(-1.5deg)}}
.shaking .chunk{animation:jig .09s infinite alternate}
@keyframes jig{from{transform:translate(-7px,-5px)}to{transform:translate(7px,6px)}}
.bub{animation:bubup 4s ease-in-out infinite;transform-box:fill-box}
@keyframes bubup{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-14px);opacity:.15}}
.shine{animation:shn 2.4s ease-out .5s 1 both}
@keyframes shn{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(520px) skewX(-20deg)}}
.shbar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;width:min(70vw,300px);margin:0 auto}
.shbar i{display:block;height:100%;background:var(--red);transition:width .3s;width:0}
.jarwrap.reveal{animation:popin .7s cubic-bezier(.3,1.4,.5,1);width:min(64vw,260px)}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
@media (prefers-reduced-motion:reduce){.lay.new,.chunk.new,.shaking,.shaking .chunk,.jarwrap.reveal,.bub,.shine{animation:none}}
.share{background:var(--panel);border:2px solid var(--blue);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:center}.share p{margin:0;font-size:17px}
.chip .pg{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--red);line-height:1}
.meterbox{display:flex;flex-direction:column;gap:6px}
.mtop{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.mdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:background .6s}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.meter .m{display:flex;flex-direction:column;gap:3px;text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meter .tr{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .fl{display:block;height:100%;width:0;background:var(--blue);transition:width .6s,background .6s}
.meter .m.bump{color:var(--red);animation:bmp .7s}.meter .m.bump .fl{background:var(--red)}
@keyframes bmp{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>

var app=document.getElementById('app');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(txt,cls,fn){var b=el('button','btn '+(cls||''),txt);b.type='button';b.addEventListener('click',fn);return b}
function find(list,k){for(var i=0;i<list.length;i++)if(list[i].k===k)return list[i];return null}
function go(screen,step){S.screen=screen;if(step!=null)S.step=step;draw();var sc=document.getElementById('scroller');if(sc)sc.scrollTop=0}
function topbar(back,dots){
  var t=el('div','top');
  if(back){var b=el('button','back','‹ Back');b.type='button';b.addEventListener('click',back);t.appendChild(b)}
  else{var im=el('img');im.src=LOGO;im.alt='Grey Goose';t.appendChild(im)}
  if(dots!=null){var d=el('div','dots');for(var i=0;i<4;i++){var x=el('i',i<=dots?'on':'');d.appendChild(x)}t.appendChild(d)}
  return t;
}
function draw(){
  var shl=document.getElementById('shell');if(shl)shl.classList.toggle('onhome',S.screen==='home');
  document.getElementById('dock').textContent='';app.textContent='';app.style.gap=(S.screen==='pick'||S.screen==='shake')?'12px':'';
  if(S.screen==='home')home();else if(S.screen==='watch')watch();else if(S.screen==='pick')pick();else if(S.screen==='shake')shake();else if(S.screen==='reveal')reveal();else if(S.screen==='card')card();else result();
}
function explore(){var a=el('a','btn alt','Explore Grey Goose');a.href='https://www.greygoose.com/';a.target='_blank';a.rel='noopener noreferrer';return a}
function home(){
  var h=el('div','stack home');
  var im=el('img');im.src=LOGO;im.alt='Grey Goose';h.appendChild(im);
  h.appendChild(el('div','eyebrow','The French Table'));
  h.appendChild(el('h1',null,'Build your shrub'));
  h.appendChild(el('p','sub','Your jar plan and Grey Goose cocktails, made for your ingredients.'));
  var s=el('div','stack');
  s.appendChild(btn('Build my shrub','',function(){S.sel={};S.last=null;go('pick',0)}));
  s.appendChild(btn('Watch the demo','alt',function(){go('watch')}));
  s.appendChild(explore());
  h.appendChild(s);app.appendChild(h);
}
function watch(){
  app.appendChild(topbar(function(){go('home')}));
  app.appendChild(el('h2',null,'Shrub basics'));
  var v=el('video');v.controls=true;v.setAttribute('playsinline','');v.preload='metadata';v.src='shrub.mp4';app.appendChild(v);
  app.appendChild(el('p','sub','Why shrubs exist, how to make one, and how to use it in Grey Goose cocktails. Turn your sound up for the music.'));
  app.appendChild(btn('Build my shrub','',function(){S.sel={};S.last=null;go('pick',0)}));
}
