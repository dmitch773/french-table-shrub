<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>French Table Shrub Guide</title>
<style>
/* Layout: app shell. One screen at a time, big tap tiles, auto-advance, result screen with three tabs. */
:root{
  --bg:#f3f7fb;--panel:#ffffff;--fg:#16254a;--muted:#52607f;--line:#cfdbe9;--blue:#2f6db5;--red:#a31d33;
  --on:#16254a;--on-fg:#ffffff;--chip:#e7eef7;
  --head:'Newsreader',Georgia,serif;--body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1830;--panel:#172345;--fg:#eef3fb;--muted:#a6b4d0;--line:#2a3a63;--blue:#7fb0ee;--red:#ee7d92;--on:#eef3fb;--on-fg:#0f1830;--chip:#1f2d55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1830;--panel:#172345;--fg:#eef3fb;--muted:#a6b4d0;--line:#2a3a63;--blue:#7fb0ee;--red:#ee7d92;--on:#eef3fb;--on-fg:#0f1830;--chip:#1f2d55;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
 padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 48px)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top img{height:40px;width:auto;display:block}
.back{font:inherit;font-size:16px;color:var(--blue);background:none;border:0;padding:10px 4px;min-height:44px;cursor:pointer}
.dots{display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--red)}
h1,h2{font-family:var(--head);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(36px,10vw,48px)}
h2{font-size:clamp(28px,7.5vw,34px)}
.sub{color:var(--muted);margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:14px;min-height:110px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;min-width:0}
.tile:active{transform:scale(.97);border-color:var(--blue)}
.tile:focus-visible,.btn:focus-visible,.tab:focus-visible,.back:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tile b{font-size:19px;font-weight:600}
.tile span.d{display:block;font-size:14px;color:var(--muted)}
.sw{width:30px;height:30px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.15)}
.tile{position:relative}
.tile[aria-pressed="true"]{border-color:var(--blue);background:var(--chip)}
.tile .ck{position:absolute;top:10px;right:12px;font-size:20px;color:var(--blue);display:none;font-weight:700}
.tile[aria-pressed="true"] .ck{display:block}
.btn[disabled]{opacity:.4;cursor:default}
.next{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px))}
.count{font-size:14px;color:var(--muted);margin:0}
.btn{font:inherit;font-weight:600;font-size:18px;border-radius:14px;border:0;min-height:56px;padding:14px 20px;cursor:pointer;background:var(--on);color:var(--on-fg);width:100%}
.btn.alt{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.home{flex:1;justify-content:center;gap:22px;text-align:center;align-items:center}
.home img{width:190px;max-width:60%;height:auto}
.home .stack{width:100%}
video{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}
.tabs{display:flex;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:4px}
.tab{flex:1;font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;border-radius:10px;min-height:44px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--on);color:var(--on-fg)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.panel p{margin:0}
ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--head);font-size:24px;font-weight:600}
.drink{display:flex;flex-direction:column;gap:2px;padding-top:14px;border-top:1px solid var(--line)}
.drink:first-of-type{border-top:0;padding-top:0}
.drink b{font-family:var(--head);font-size:21px;font-weight:600}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-left:8px;font-family:var(--body)}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);text-align:center}
.pill{display:flex;gap:8px;flex-wrap:wrap}
.pill span{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
</style>

  if(S.screen==='home')home();else if(S.screen==='watch')watch();else if(S.screen==='pick')pick();else if(S.screen==='card')card();else result();
}
function home(){
  var h=el('div','stack home');
  var im=el('img');im.src=LOGO;im.alt='Grey Goose';h.appendChild(im);
  h.appendChild(el('div','eyebrow','The French Table'));
  h.appendChild(el('h1',null,'Build your shrub'));
  h.appendChild(el('p','sub','Your jar plan and Grey Goose cocktails, made for your ingredients.'));
  var s=el('div','stack');
  s.appendChild(btn('Start','',function(){S.sel={};go('pick',0)}));
  s.appendChild(btn('Watch the demo','alt',function(){go('watch')}));
  h.appendChild(s);app.appendChild(h);
}
function watch(){
  app.appendChild(topbar(function(){go('home')}));
  app.appendChild(el('h2',null,'Shrub basics'));
  var v=el('video');v.controls=true;v.setAttribute('playsinline','');v.preload='metadata';v.src='shrub.mp4';app.appendChild(v);
  app.appendChild(el('p','sub','4 minutes, with sound. Why shrubs exist, how to make one, and shrubs in Grey Goose cocktails.'));
  app.appendChild(btn('Build my shrub','',function(){S.sel={};go('pick',0)}));
}
function pick(){
  var st=STEPS[S.step];
  app.appendChild(topbar(function(){if(S.step>0)go('pick',S.step-1);else go('home')},S.step));
  app.appendChild(el('h2',null,st.q));
  app.appendChild(el('p','count','Pick '+(st.min?'1':'0')+' to '+st.max+'. Mix them if you like.'));
  var g=el('div','grid');
  var nx=btn('', 'next', function(){
    if(S.step<STEPS.length-1)go('pick',S.step+1);else{S.tab='jar';go('result')}
  });
  function sync(){
    var n=(S.sel[st.id]||[]).length;
    nx.disabled=n<st.min;
    nx.textContent=S.step===STEPS.length-1?'See my shrub':(n===0&&st.min===0?'Skip herbs':'Next');
  }
  st.list.forEach(function(it){
    var b=el('button','tile');b.type='button';
    b.setAttribute('aria-pressed',(S.sel[st.id]||[]).indexOf(it.k)>=0);
    var sw=el('span','sw');sw.style.background=it.c;b.appendChild(sw);
    b.appendChild(el('span','ck','✓'));
    var w=el('div');w.appendChild(el('b',null,it.n));w.appendChild(el('span','d',it.d));
    var wrap=el('div');wrap.appendChild(w);b.appendChild(wrap);
    b.addEventListener('click',function(){
      var a=(S.sel[st.id]||[]).slice(),i=a.indexOf(it.k);
      if(i>=0)a.splice(i,1);else if(a.length<st.max)a.push(it.k);
      S.sel[st.id]=a;
      b.setAttribute('aria-pressed',a.indexOf(it.k)>=0);
      sync();
    });
    g.appendChild(b);
  });
  app.appendChild(g);
  app.appendChild(nx);sync();
}
function jn(a,w){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' '+w+' '+a[a.length-1]}

/* ---------- cocktail engine ---------- */
var STYLES={
 fizz:{style:'Fizz',spec:'1.5 oz Grey Goose, 0.75 oz shrub, top with soda. Ice, tall glass.',why:'Long, light and easy.',
   w:{apple:3,carrot:3,mint:3,thyme:1,pear:1,champagne:2}},
 grand:{style:'Grand Fizz',spec:'1 oz Grey Goose, 0.5 oz St-Germain, 0.75 oz shrub, top with soda. Ice, tall glass.',why:'Floral and bright, in the spirit of Le Grand Fizz.',
   w:{pear:4,apple:2,mint:2,thyme:3,champagne:1,caster:1}},
 sour:{style:'Sour',spec:'1.5 oz Grey Goose, 1 oz shrub, 0.5 oz dry vermouth. Shake with ice, strain.',why:'Bold and bright, with a clean finish.',
   w:{cranberry:4,pomegranate:3,acv:2,brown:2,sage:2,apple:1,carrot:1}},
 martini:{style:'Martini',spec:'1.75 oz Grey Goose, 0.33 oz dry vermouth, 1 dash orange bitters, 0.25 oz shrub. Stir with ice, strain into a chilled glass.',why:'Silky and spirit forward.',
   w:{beet:4,pear:2,rosemary:3,sage:2,champagne:2,thyme:1,carrot:1}},
 spritz:{style:'Spritz',spec:'1 oz Grey Goose, 1 oz shrub, top with 3 oz dry sparkling wine. Ice, wine glass.',why:'Festive and French, easy to sip.',
   w:{cranberry:2,pomegranate:3,champagne:3,apple:1,caster:1,mint:1,rosemary:1}}
};
var GARN={apple:'a thin apple fan',pear:'a pear slice',cranberry:'three cranberries on a pick',pomegranate:'a few pomegranate arils',beet:'a thin beet curl',carrot:'a carrot ribbon'};
function drinksFor(c){
  var keys=[].concat(c.P,c.H,c.Su,c.V).map(function(x){return x.k});
  var out=Object.keys(STYLES).map(function(id,i){
    var d=STYLES[id],sc=0;keys.forEach(function(k){sc+=d.w[k]||0});
    return {id:id,sc:sc,i:i,d:d};
  });
  out.sort(function(a,b){return b.sc-a.sc||a.i-b.i});
  var tw=function(id){
    var long=(id==='fizz'||id==='grand'||id==='spritz'),t=[];
    if(c.V.some(function(x){return x.k==='champagne'}))t.push(long?'Champagne vinegar keeps it light, so a splash more soda or wine is fine.':'Champagne vinegar is delicate, so start with a little less shrub and taste.');
    if(c.V.some(function(x){return x.k==='acv'}))t.push(long?'Cider vinegar is rounder, so a thin lemon wheel brightens it.':'Cider vinegar is rounder, so give it a little longer on ice for a softer edge.');
    if(c.Su.some(function(x){return x.k==='brown'}))t.push('Brown sugar brings caramel, so a dash of orange bitters ties it in.');
    if(c.Su.some(function(x){return x.k==='caster'}))t.push('Caster sugar stays bright, so a lemon twist lifts it.');
    return t;
  };
  var base=c.P[0].n+(c.H[0]?' + '+c.H[0].n:'');
  return out.slice(0,3).map(function(o,j){
    var g=[GARN[c.P[0].k]];if(c.H[0])g.push('a sprig of '+c.H[0].n.toLowerCase());
    return {n:base+' '+o.d.style,spec:o.d.spec,why:o.d.why,tweak:(function(){var t=tw(o.id);return t[j%t.length]})(),garn:'Garnish: '+g.join(' and ')+'.'};
  });
}
function chosen(){
  var pick=function(ids,list){return (ids||[]).map(function(k){return find(list,k)})};
  var P=pick(S.sel.produce,PRODUCE),H=pick(S.sel.herb,HERBS),Su=pick(S.sel.sugar,SUGARS),V=pick(S.sel.vinegar,VINS);
  var slow=P.filter(function(x){return !x.soft});
  var cnt={};P.forEach(function(x){cnt[x.fit]=(cnt[x.fit]||0)+1});
  var fit=P[0].fit;Object.keys(cnt).forEach(function(k){if(cnt[k]>cnt[fit])fit=k});
  return {P:P,H:H,Su:Su,V:V,slow:slow.length>0,slowNames:slow.map(function(x){return x.n}),look:(slow[0]||P[0]).look,fit:fit,
    name:P.concat(H).map(function(x){return x.n}).join(' + ')+' Shrub'};
}
function result(){
  var c=chosen();
  var days=c.slow?'7':'3 to 5';
  app.appendChild(topbar(function(){go('pick',3)}));
  var head=el('div','stack');head.appendChild(el('div','eyebrow','Your shrub'));head.appendChild(el('h2',null,c.name));
  var pills=el('div','pill');c.P.concat(c.H,c.Su,c.V).forEach(function(x){pills.appendChild(el('span',null,x.n))});head.appendChild(pills);
  app.appendChild(head);
  var tabs=el('div','tabs');tabs.setAttribute('role','tablist');
  [['jar','Jar'],['store','Storing'],['drinks','Cocktails']].forEach(function(t){
    var b=el('button','tab',t[1]);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',S.tab===t[0]);
    b.addEventListener('click',function(){S.tab=t[0];draw();});tabs.appendChild(b);
  });
  app.appendChild(tabs);
  var pn=el('div','panel');
  if(S.tab==='jar'){
    pn.appendChild(el('h3',null,'How it tastes'));
    pn.appendChild(el('p',null,'Expect '+jn(c.P.map(function(x){return x.taste}),'and')+(c.H.length?', with '+jn(c.H.map(function(x){return x.taste}),'and')+' notes':'')+'. Sugar: '+jn(c.Su.map(function(x){return x.n.toLowerCase()+' for '+x.taste}),'and')+'. Vinegar: '+jn(c.V.map(function(x){return x.n.toLowerCase()+', '+x.taste}),'and')+'. Color: '+c.look+'.'));
    pn.appendChild(el('h3',null,'In your 16 oz jar'));
    pn.appendChild(el('p',null,'Equal parts produce, sugar and vinegar. Split each part evenly between your picks: '+jn(c.P.map(function(x){return x.n.toLowerCase()}),'and')+', '+jn(c.Su.map(function(x){return x.n.toLowerCase()}),'and')+' and '+jn(c.V.map(function(x){return x.n.toLowerCase()}),'and')+(c.H.length?', plus a few sprigs of '+jn(c.H.map(function(x){return x.n.toLowerCase()}),'and'):'')+'.'));
    pn.appendChild(el('h3',null,'What to do'));
    var ol=el('ol');['Seal the jar and keep it in the fridge.','Shake it once a day.','Strain on day '+days+', pressing the solids.'+(c.slow?' '+jn(c.slowNames,'and')+' need the full 7 days.':''),'Pour it back into the clean jar.'].forEach(function(x){ol.appendChild(el('li',null,x))});pn.appendChild(ol);
  }else if(S.tab==='store'){
    pn.appendChild(el('h3',null,'Keep it cold'));
    pn.appendChild(el('p',null,'Fridge the whole time, before and after straining.'));
    pn.appendChild(el('h3',null,'How long'));
    pn.appendChild(el('p',null,'Use it within about 4 weeks.'));
    pn.appendChild(el('h3',null,'Look and smell'));
    pn.appendChild(el('p',null,'Shake gently before you pour. Taste it each week, since the sharpness mellows as it sits. If it smells off or looks wrong, let it go.'));
  }else{
    drinksFor(c).forEach(function(d,i){
      var bx=el('div','drink');var t=el('b',null,d.n);if(i===0)t.appendChild(el('span','tag','Best match'));
      bx.appendChild(t);bx.appendChild(el('p',null,d.spec));bx.appendChild(el('p','muted',d.why+' '+d.garn));bx.appendChild(el('p','muted',d.tweak));pn.appendChild(bx);
    });
    pn.appendChild(el('p','muted','Wild mix? Start with less shrub, taste, and add more.'));
  }
  app.appendChild(pn);
  var again=el('div','stack');
  again.appendChild(btn('Save my card','',function(){go('card')}));
  again.appendChild(btn('Make another','alt',function(){S.sel={};go('pick',0)}));
  again.appendChild(btn('Watch the demo','alt',function(){go('watch')}));
  app.appendChild(again);
  app.appendChild(el('p','note','Amounts are starting points. Taste and adjust. Please enjoy responsibly.'));
}

 beet:'<path d="M-10 60 Q-4 100 6 110" stroke="#7a1f4a" stroke-width="8" fill="none" stroke-linecap="round"/><circle cy="10" r="62" fill="#7a1f4a"/><path d="M-14 -50 Q-30 -100 -44 -112" stroke="#3f7d3a" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M10 -52 Q26 -102 40 -116" stroke="#3f7d3a" stroke-width="12" fill="none" stroke-linecap="round"/>',
 carrot:'<path d="M-42 -50 L42 -50 L0 112 Z" fill="#e8872b"/><path d="M-20 -20 h22 M-8 20 h18 M-2 62 h10" stroke="#c4691a" stroke-width="6" stroke-linecap="round"/><path d="M-20 -52 Q-34 -92 -48 -102 M0 -52 L0 -108 M20 -52 Q34 -92 48 -102" stroke="#3f7d3a" stroke-width="10" fill="none" stroke-linecap="round"/>'
};
var SPRIG='<path d="M0 110 Q8 0 0 -110" stroke="#4f7a45" stroke-width="7" fill="none" stroke-linecap="round"/><g fill="#5f9a55"><ellipse cx="-22" cy="70" rx="24" ry="9" transform="rotate(-35 -22 70)"/><ellipse cx="24" cy="40" rx="24" ry="9" transform="rotate(35 24 40)"/><ellipse cx="-22" cy="10" rx="24" ry="9" transform="rotate(-35 -22 10)"/><ellipse cx="24" cy="-20" rx="24" ry="9" transform="rotate(35 24 -20)"/><ellipse cx="-20" cy="-52" rx="22" ry="8" transform="rotate(-35 -20 -52)"/><ellipse cx="18" cy="-82" rx="20" ry="8" transform="rotate(35 18 -82)"/></g>';
function wrap(t,n){var w=t.split(' '),l=[''],i=0;w.forEach(function(x){if((l[i]+' '+x).trim().length>n){i++;l[i]=x}else l[i]=(l[i]+' '+x).trim()});return l}
function bestDrink(p){
  var D={fizz:['Shrub Fizz','1.5 oz Grey Goose, 0.75 oz shrub, top with soda'],sour:['Shrub Sour','1.5 oz Grey Goose, 1 oz shrub, 0.5 oz dry vermouth, shaken'],martini:['Shrub Martini','1.75 oz Grey Goose, 0.33 oz dry vermouth, 1 dash orange bitters, 0.25 oz shrub, stirred']};
  return D[p.fit];
}
function sprigSVG(col){return SPRIG.replace('#5f9a55',col)}
function cardSVG(){
  var c=chosen();
  var strain=c.slow?'Strain Nov 23':'Strain Nov 19 to 21';
  var dd=drinksFor(c)[0],d=[dd.n,dd.spec];
  var o='<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Georgia,\'Times New Roman\',serif">';
  o+='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d4e8"/><stop offset=".55" stop-color="#e6f1f8"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>';
  o+='<rect width="1080" height="1350" fill="url(#g)"/>';
  o+='<image href="'+LOGO+'" x="410" y="40" width="260" height="154"/>';
  o+='<text x="540" y="240" text-anchor="middle" font-size="26" letter-spacing="8" fill="#a31d33" font-family="Arial,sans-serif" font-weight="bold">MY FRENCH TABLE SHRUB</text>';
  var icons=c.P.map(function(x){return ICON[x.k]}).concat(c.H.map(function(x){return sprigSVG(x.c)}));
  var n=icons.length,sc=n<=2?1.35:(n<=4?1.0:0.8),step=Math.min(300,880/n);
  icons.forEach(function(ic,i){o+='<g transform="translate('+(540+(i-(n-1)/2)*step)+',440) scale('+sc+')">'+ic+'</g>'});
  var nl=wrap(c.name,30);if(nl.length>2)nl=[nl[0],nl.slice(1).join(' ')];
  var ys=nl.length===1?[655]:[630,688];
  nl.forEach(function(l,i){o+='<text x="540" y="'+ys[i]+'" text-anchor="middle" font-size="'+(nl.length===1?(c.name.length>20?58:68):50)+'" fill="#16254a" font-weight="bold">'+esc(l)+'</text>'});
  var sub=c.Su.map(function(x){return x.n}).join(' + ')+'  &#183;  '+c.V.map(function(x){return x.n}).join(' + ');
  var subx=sub.length>56?24:34;
  o+='<text x="540" y="742" text-anchor="middle" font-size="'+subx+'" fill="#34456e" font-family="Arial,sans-serif">'+sub.replace(/&(?!#183;)/g,'&amp;')+'</text>';
  o+='<rect x="140" y="775" width="800" height="4" fill="#2f6db5"/>';
  o+='<text x="540" y="842" text-anchor="middle" font-size="40" fill="#16254a" font-family="Arial,sans-serif" font-weight="bold">'+esc(strain+', then keep it chilled')+'</text>';
  o+='<text x="540" y="890" text-anchor="middle" font-size="30" fill="#34456e" font-family="Arial,sans-serif">Fridge it, shake it daily, use within 4 weeks</text>';
  o+='<text x="540" y="975" text-anchor="middle" font-size="26" letter-spacing="6" fill="#a31d33" font-family="Arial,sans-serif" font-weight="bold">MAKE IT WITH GREY GOOSE</text>';
  o+='<text x="540" y="1030" text-anchor="middle" font-size="46" fill="#16254a" font-weight="bold">'+esc(d[0])+'</text>';
  wrap(d[1],54).forEach(function(l,i){o+='<text x="540" y="'+(1076+i*38)+'" text-anchor="middle" font-size="29" fill="#34456e" font-family="Arial,sans-serif">'+esc(l)+'</text>'});
  o+='<rect x="0" y="1190" width="1080" height="160" fill="#16254a"/>';
  o+='<text x="540" y="1248" text-anchor="middle" font-size="30" fill="#ffffff" font-family="Arial,sans-serif" font-weight="bold">Grey Goose French Table</text>';
  o+='<text x="540" y="1288" text-anchor="middle" font-size="26" fill="#cfe0f2" font-family="Arial,sans-serif">Monday, November 16, 2026  &#183;  The Drake Oak Brook</text>';
  o+='<text x="540" y="1326" text-anchor="middle" font-size="26" fill="#ffffff" font-family="Arial,sans-serif">@greygoose  &#183;  @fraicheprince</text>';
  o+='</svg>';
  return o;
}
function card(){
  app.appendChild(topbar(function(){go('result')}));
  app.appendChild(el('h2',null,'Your card'));
  var holder=el('div');holder.style.cssText='border-radius:12px;overflow:hidden;border:2px solid var(--line);line-height:0';
  var im=el('img');im.alt='Your shrub card';im.style.cssText='width:100%;height:auto;display:block';
  var svg=cardSVG(),uri='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  im.src=uri;
  var tmp=new Image();
  tmp.onload=function(){try{var c=document.createElement('canvas');c.width=1080;c.height=1350;c.getContext('2d').drawImage(tmp,0,0,1080,1350);im.src=c.toDataURL('image/png')}catch(e){}};
  tmp.src=uri;
  holder.appendChild(im);app.appendChild(holder);
  app.appendChild(el('p','sub','Press and hold the card, then tap Save Image. Tag @greygoose and @fraicheprince when you share it.'));
  app.appendChild(btn('Back to my shrub','alt',function(){go('result')}));
}
draw();
